services:
  new-api:
    image: ${NEW_API_IMAGE:?Set NEW_API_IMAGE in image.env}
    container_name: new-api
    restart: unless-stopped
    command: ["--log-dir", "/app/logs"]
    ports:
      - "127.0.0.1:8091:3000"
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      SQLITE_PATH: /data/new-api.db
      GOMEMLIMIT: 384MiB
      GOGC: "75"
      DEFAULT_LANGUAGE: zh-CN
      ERROR_LOG_ENABLED: "true"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/status | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
